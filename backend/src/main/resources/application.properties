server.port=${PORT:8080}
spring.application.name=portfolio-backend

# PostgreSQL (Render: set DATABASE_URL or SPRING_DATASOURCE_* env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ileanat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Contact form email delivery (set env vars before running)
# Gmail example: SPRING_MAIL_USERNAME=you@gmail.com SPRING_MAIL_PASSWORD=your-app-password
spring.mail.host=smtp.gmail.com
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
contact.recipient=${CONTACT_RECIPIENT:ileanatemer@gmail.com}

# Resend email delivery for location access notifications
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}

# Location access requests
location.access.admin-api-key=${LOCATION_ADMIN_API_KEY:}
location.access.admin-page-url=${LOCATION_ACCESS_ADMIN_PAGE_URL:}
location.access.requester-page-url=${LOCATION_ACCESS_REQUESTER_PAGE_URL:}
location.access.notification-recipient=${LOCATION_ACCESS_NOTIFICATION_RECIPIENT:${contact.recipient}}
location.access.rate-limit.submit-per-minute=${LOCATION_ACCESS_SUBMIT_RATE_LIMIT:5}
location.access.rate-limit.validate-per-minute=${LOCATION_ACCESS_VALIDATE_RATE_LIMIT:30}
