spring.datasource.url=jdbc:h2:mem:locationaccess;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

location.access.admin-api-key=test-admin-key
location.access.admin-page-url=https://example.com/admin/location-requests
location.access.requester-page-url=https://example.com/location-access
location.access.rate-limit.submit-per-minute=100
location.access.rate-limit.validate-per-minute=100

resend.api-key=test-resend-api-key
resend.from-email=notifications@example.com
contact.recipient=owner@example.com
